<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EFE6; --card:#FFFCF6; --ink:#16130F; --soft:#6E665B; --line:#E3DBCD;
  --accent:#FF5A1F; --love:#1E9E6A; --fine:#E8A317; --nope:#E5484D; --sky:#C9E4FF; --butter:#FFE58A; --mint:#BDEBD3;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E1D3;color:var(--ink);font-family:var(--body);font-size:15px}
button{font-family:inherit;color:inherit;cursor:pointer}
img{display:block}
/* phone frame on desktop, full screen on phones */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:20px}
.aside{max-width:260px}
.aside .wm{font-size:64px}
.aside p{color:var(--soft);line-height:1.5}
.aside .api{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;background:var(--card)}
.aside .api i{width:8px;height:8px;border-radius:50%;background:var(--love);display:inline-block}
.aside kbd{border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-family:var(--body);font-size:12px;background:var(--card)}
#phone{position:relative;width:400px;height:min(860px,calc(100vh - 40px));background:var(--paper);border:10px solid var(--ink);border-radius:46px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;box-shadow:12px 12px 0 rgba(22,19,15,.15)}
@media (max-width:760px){.aside{display:none}.stage{padding:0}#phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 24px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.wm{font-family:var(--display);font-weight:800;letter-spacing:-1.5px;line-height:1}
.wm b{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .wm{font-size:34px}
h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.6px;margin:0 0 4px;line-height:1.05}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:22px 0 10px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--soft)}
.sub{color:var(--soft);font-size:14px}
.box{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink)}
.pill{border:1.5px solid var(--ink);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
.pill.on{background:var(--ink);color:var(--paper)}
.cta{background:var(--accent);color:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.cta.ghost{background:var(--card);color:var(--ink)}
.cta.wide{width:100%}
.ibtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);display:grid;place-items:center;flex:none;padding:0}
.ibtn svg{width:14px;height:14px}
.ibtn.add{background:var(--ink);color:var(--paper)}
/* score bubble, Beli-style */
.sc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none;border:2px solid currentColor;background:var(--card)}
.love{color:var(--love)} .fine{color:var(--fine)} .nope{color:var(--nope)}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .n{width:22px;font-family:var(--display);font-weight:800;font-size:16px;text-align:center;flex:none}
.row img{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--ink);object-fit:cover;flex:none;background:var(--line)}
.row .m{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* carousel */
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{width:140px;flex:none;scroll-snap-align:start;cursor:pointer;position:relative}
.tile img{width:140px;height:140px;border-radius:14px;border:1.5px solid var(--ink);object-fit:cover;box-shadow:3px 3px 0 var(--ink);background:var(--line)}
.tile .t{margin-top:9px;font-size:14px}
.tile .pos{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:13px;border-radius:8px;padding:2px 7px}
.tile .sc{position:absolute;top:100px;right:-4px;width:38px;height:38px;font-size:13px}
.tile .plus{position:absolute;top:104px;right:4px}
.skel{background:linear-gradient(90deg,var(--line),#EFE8DC,var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* hero */
.hero{padding:18px;position:relative;overflow:hidden;background:var(--butter)}
.hero h2{font-size:24px;max-width:220px}
.hero .disc{position:absolute;right:-30px;top:-20px;width:140px;height:140px;opacity:.95}
.feed .row{cursor:default}
.feed .verb{font-size:14px}
.feed .when{font-size:12px;color:var(--soft)}
/* search */
.search{display:flex;align-items:center;gap:10px;padding:12px 14px}
.search input{border:0;outline:0;background:none;font:500 16px var(--body);flex:1;color:var(--ink);min-width:0}
.search svg{width:18px;height:18px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* tab bar */
.tabbar{display:flex;justify-content:space-around;border-top:1.5px solid var(--ink);background:var(--card);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--soft);padding:4px 8px;border-radius:12px;position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar .rk{background:var(--accent);color:#fff;border:1.5px solid var(--ink);width:46px;height:46px;border-radius:14px;justify-content:center;margin-top:-22px;box-shadow:2px 2px 0 var(--ink);padding:0}
.tabbar .rk svg{width:22px;height:22px}
/* bottom sheet */
.scrim{position:absolute;inset:0;background:rgba(22,19,15,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--paper);border-top:1.5px solid var(--ink);border-radius:26px 26px 0 0;padding:10px 18px 24px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:6;scrollbar-width:none}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.close{position:absolute;right:14px;top:14px}
/* vinyl */
.vinyl{width:150px;height:150px;border-radius:50%;margin:6px auto 0;position:relative;background:repeating-radial-gradient(circle,#1d1a16 0 2px,#2a2621 2px 4px);border:1.5px solid var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:4px 4px 0 rgba(22,19,15,.25)}
.vinyl img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--paper)}
.vinyl::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--paper)}
.vinyl.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.playhint{font-size:12px;color:var(--soft);text-align:center;margin-top:8px}
/* tier buttons */
.tiers{display:grid;gap:10px;margin-top:16px}
.tierb{display:flex;align-items:center;gap:14px;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:14px 16px;font-weight:700;font-size:16px;box-shadow:3px 3px 0 var(--ink);text-align:left;transition:transform .08s,box-shadow .08s}
.tierb:active{transform:translate(3px,3px);box-shadow:none}
.tierb .dot{width:26px;height:26px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
.tierb small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.tierb kbd{margin-left:auto;font-family:var(--body);font-size:11px;color:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
/* duel */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;position:relative}
.vs{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;z-index:2;border:3px solid var(--paper)}
.side{border:1.5px solid var(--ink);border-radius:16px;background:var(--card);padding:10px;text-align:center;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .2s;position:relative}
.side:hover{transform:translateY(-3px)}
.side.playing{background:#FFF1E8}
.side.win{background:var(--mint);transform:scale(1.03)}
.side.lose{opacity:.45;transform:scale(.97)}
.side .cov{width:100%;aspect-ratio:1;border-radius:11px;border:1.5px solid var(--ink);object-fit:cover}
.mys{width:100%;aspect-ratio:1;border-radius:11px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:54px;position:relative;overflow:hidden}
.mys.A{background:var(--sky)} .mys.B{background:var(--butter)}
.side .t{margin-top:8px;font-size:14px}
.bars{display:flex;gap:3px;align-items:flex-end;height:18px;justify-content:center;margin-top:6px;visibility:hidden}
.playing .bars{visibility:visible}
.bars i{width:4px;background:var(--accent);border-radius:2px;animation:eq .7s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.duelfoot{display:flex;gap:10px;margin-top:14px}
.duelfoot .cta{flex:1;font-size:14px;padding:10px}
.steps{display:flex;gap:5px;justify-content:center;margin-top:14px}
.steps i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.steps i.done{background:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.sw{width:36px;height:22px;border-radius:99px;border:1.5px solid var(--ink);background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on::after{left:16px;background:#fff}
/* result */
.bigsc{width:110px;height:110px;font-size:40px;border-width:4px;margin:18px auto 8px}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;width:10px;height:10px;border-radius:2px;top:40%;left:50%;animation:pop 1.1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
/* lists */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 6px}
.empty{text-align:center;padding:30px 10px;color:var(--soft)}
.empty .wm{font-size:44px;color:var(--ink);margin-bottom:6px}
/* detail */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.fact{border:1.5px solid var(--ink);border-radius:12px;padding:10px;background:var(--card);text-align:center}
.fact b{display:block;font-family:var(--display);font-size:20px}
.fact span{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.gtags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.gtag{font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--sky);border:1.5px solid var(--ink)}
/* profile */
.poster{padding:20px;background:var(--ink);color:var(--paper);border-radius:20px;position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--accent)}
.poster .k{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.poster .persona{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:-.8px;margin:8px 0 12px;max-width:290px}
.poster .persona em{font-style:normal;color:var(--accent)}
.poster .rings{position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 8px,rgba(255,255,255,.08) 8px 10px)}
.poster .cov3{display:flex;margin-top:4px}
.poster .cov3 img{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);margin-right:-10px;object-fit:cover}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--soft)}
.metric{padding:14px;margin-top:10px}
.metric .k{font-size:12px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.metric .v{font-family:var(--display);font-weight:800;font-size:22px;margin-top:2px}
.slider{height:14px;border-radius:99px;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--sky),var(--butter),var(--accent));position:relative;margin:12px 0 6px}
.slider b{position:absolute;top:-6px;width:8px;height:24px;border-radius:4px;background:var(--ink);transition:left 1s cubic-bezier(.2,.9,.25,1)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.gbar{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:14px;font-weight:600}
.gbar .l{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .tr{flex:1;height:12px;border-radius:99px;border:1.5px solid var(--ink);overflow:hidden;background:var(--card)}
.gbar .f{height:100%;background:var(--accent);width:0;transition:width .9s cubic-bezier(.2,.9,.25,1)}
.tempo{display:flex;gap:3px;align-items:flex-end;height:40px;margin-top:8px}
.tempo i{flex:1;background:var(--ink);border-radius:3px 3px 0 0;opacity:.85}
.drift{font-weight:800;font-family:var(--display);font-size:14px;width:40px;text-align:right;flex:none}
.up{color:var(--love)} .down{color:var(--nope)}
/* blend */
.ring{width:170px;height:170px;margin:10px auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px}
.ring .pct small{display:block;font-size:12px;font-family:var(--body);font-weight:600;color:var(--soft);text-align:center;margin-top:-30px}
textarea{width:100%;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:10px;font:13px var(--body);resize:none;height:64px;outline:none}
.fight{display:flex;align-items:center;gap:8px;font-size:13px}
.fight .sc{width:34px;height:34px;font-size:12px}
/* breakdown */
.asp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.asp:last-child{border-bottom:0}
.asp span{font-weight:600;font-size:14px}
.asp span small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.dots{display:flex;gap:6px;flex:none}
.dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);padding:0;transition:transform .1s,background .15s}
.dots button.on{background:var(--accent)}
.dots button:active{transform:scale(.85)}
.moodchips{display:flex;gap:7px;flex-wrap:wrap}
.moodchips .pill{font-size:12.5px;padding:6px 11px}
.abar{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;font-weight:600}
.abar .l{width:120px;flex:none}
.abar .tr{flex:1;display:flex;gap:4px}
.abar .tr i{flex:1;height:10px;border-radius:3px;border:1.5px solid var(--ink);background:var(--card)}
.abar .tr i.on{background:var(--accent)}
.abar .tr i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--card) 50%)}
.driver{display:inline-block;background:var(--accent);color:#fff;border:1.5px solid var(--ink);border-radius:6px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:1px;text-transform:uppercase;letter-spacing:.4px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:9;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.mini{position:absolute;left:12px;right:12px;bottom:84px;display:none;align-items:center;gap:10px;padding:8px 10px;z-index:4}
.mini.show{display:flex}
.mini img{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink)}
.mini .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 0 0 14px}
</style>
</head>
<body>
<div class="stage">
  <div class="aside">
    <div class="wm">lilt<b>.</b></div>
    <p>Rank songs against each other, not on a 1–5 star scale. lilt places each new song with a few blind duels, then tells you what your taste says about you.</p>
    <span class="api"><i></i> Live data from the Deezer public API</span>
    <p style="font-size:13px;margin-top:18px">In a duel: <kbd>←</kbd> <kbd>→</kbd> to pick, <kbd>T</kbd> for a tie, <kbd>Space</kbd> to replay.</p>
  </div>
  <div id="phone">
    <main class="screen" id="screen"></main>
    <div class="mini box" id="mini"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* =========================================================================
   DATA SOURCE: Deezer public API (https://developers.deezer.com/api)
   No key needed. Deezer sends no CORS headers, so we call it with JSONP.
   Endpoints used: /search, /chart/0/tracks, /track/{id}, /album/{id},
                   /artist/{id}/related, /artist/{id}/top
   ========================================================================= */
let jsonpN = 0;
const apiCache = new Map();
function deezer(path, params = {}, { fresh = false } = {}) {
  const key = path + JSON.stringify(params);
  if (!fresh && apiCache.has(key)) return apiCache.get(key);
  const p = new Promise((resolve, reject) => {
    const cb = '__dz' + (++jsonpN);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 9000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); d && d.error ? reject(d.error) : resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = `https://api.deezer.com/${path}?${new URLSearchParams({ ...params, output: 'jsonp', callback: cb })}`;
    document.head.appendChild(s);
  });
  apiCache.set(key, p);
  p.catch(() => apiCache.delete(key));
  return p;
}

/* ---------------- state ---------------- */
const TIERS = {
  love: { label: 'I loved it', hint: 'On repeat', color: 'var(--love)', range: [6.8, 10], key: '1' },
  fine: { label: 'It was fine', hint: 'Would not skip', color: 'var(--fine)', range: [3.4, 6.7], key: '2' },
  nope: { label: 'Not for me', hint: 'Skip, every time', color: 'var(--nope)', range: [0, 3.3], key: '3' },
};
const ORDER = ['love', 'fine', 'nope'];
const ASPECTS = [['vocals', 'Vocals', 'Voice, delivery, harmonies'], ['lyrics', 'Lyrics', 'Words that hit'], ['beat', 'Beat & production', 'Sound, mix, the drop'], ['feels', 'Emotional hit', 'How hard it lands'], ['replay', 'Replay value', 'Still good on play #50']];
const MOODS = ['Late night', 'Main character', 'In my feels', 'Gym', 'Party', 'Road trip', 'Focus', 'Sunday morning', 'Heartbreak', 'Hype'];
let state = { name: 'You', ranked: [], picks: 0, log: [] };
try { const s = JSON.parse(localStorage.getItem('lilt')); if (s && Array.isArray(s.ranked)) state = { ...state, ...s }; } catch (e) {}
let blind = true;
try { blind = localStorage.getItem('lilt-blind') !== 'off'; } catch (e) {}
const save = () => { try { localStorage.setItem('lilt', JSON.stringify(state)); } catch (e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => state.ranked.find(s => s.id === id);

function scores() {
  const out = new Map();
  for (const t of ORDER) {
    const g = state.ranked.filter(s => s.tier === t), [lo, hi] = TIERS[t].range;
    g.forEach((s, i) => out.set(s.id, g.length === 1 ? hi : hi - (hi - lo) * i / (g.length - 1)));
  }
  return out;
}
const fmt = n => (Math.round(n * 10) / 10).toFixed(1);
function bubble(song, cls = '') { const v = scores().get(song.id); return `<div class="sc ${song.tier} ${cls}">${fmt(v)}</div>`; }
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; }

function toSong(t) {
  return { id: t.id, title: t.title_short || t.title, artist: t.artist.name, artistId: t.artist.id,
    cover: t.album.cover_medium, coverBig: t.album.cover_big || t.album.cover_medium, albumId: t.album.id,
    preview: t.preview, rank: t.rank || 0, bpm: 0, year: null, genres: [] };
}
async function enrich(song) {
  try { const d = await deezer('track/' + song.id); song.bpm = d.bpm || 0; song.year = (d.release_date || '').slice(0, 4) || null; if (d.rank) song.rank = d.rank; } catch (e) {}
  try { const a = await deezer('album/' + song.albumId); song.genres = (a.genres?.data || []).map(g => g.name); if (!song.year && a.release_date) song.year = a.release_date.slice(0, 4); } catch (e) {}
  save();
}

/* ---------------- audio + mini player ---------------- */
const audio = new Audio();
let nowPlaying = null, onEndCb = null;
async function play(song, onEnd) {
  stop();
  nowPlaying = song; onEndCb = onEnd || null;
  let url = song.preview;
  try { const f = await deezer('track/' + song.id, {}, { fresh: true }); if (f.preview) url = song.preview = f.preview; } catch (e) {} // Deezer preview links expire
  if (nowPlaying !== song) return;
  audio.src = url; audio.play().catch(() => {});
  syncPlayUI();
}
function stop() { audio.pause(); nowPlaying = null; onEndCb = null; syncPlayUI(); }
audio.onended = () => { const cb = onEndCb; nowPlaying = null; onEndCb = null; syncPlayUI(); cb && cb(); };
audio.ontimeupdate = () => { const pg = $('#mini .pg'); if (pg && audio.duration) pg.style.width = (100 * audio.currentTime / audio.duration) + '%'; };
function syncPlayUI() {
  document.querySelectorAll('[data-vinyl]').forEach(v => v.classList.toggle('spin', !!nowPlaying && nowPlaying.id == v.dataset.vinyl));
  const sheetOpen = $('#sheet').classList.contains('show');
  const m = $('#mini');
  if (nowPlaying && !sheetOpen) {
    m.innerHTML = `<img src="${esc(nowPlaying.cover)}" alt=""><div style="flex:1;min-width:0"><div class="t" style="font-size:13px">${esc(nowPlaying.title)}</div><div class="a" style="font-size:12px">${esc(nowPlaying.artist)} · 30s preview</div></div><button class="ibtn" onclick="stop()">${IC.pause}</button><div class="pg"></div>`;
    m.classList.add('show');
  } else m.classList.remove('show');
}

/* generic click delegation for song actions */
const pool = new Map(); // song id -> raw song from any API list
function remember(arr) { arr.forEach(t => t && t.preview && pool.set(t.id, toSong(t))); return arr; }
document.addEventListener('click', e => {
  const r = e.target.closest('[data-rank]'); if (r) { e.stopPropagation(); const s = pool.get(+r.dataset.rank); if (s) startRank({ ...s }); return; }
  const p = e.target.closest('[data-play]'); if (p) { e.stopPropagation(); const id = +p.dataset.play; const s = byId(id) || pool.get(id); if (s) (nowPlaying && nowPlaying.id === id) ? stop() : play(s); return; }
  const o = e.target.closest('[data-open]'); if (o) { const id = +o.dataset.open; byId(id) ? openDetail(byId(id)) : (pool.get(id) && startRank({ ...pool.get(id) })); }
});

document.addEventListener('click', e => { const g = e.target.closest('[data-go-tab]'); if (g) go(g.dataset.goTab, g.dataset.goTab === 'search'); });
function skelTiles() { return Array(4).fill('<div class="tile"><div class="skel" style="width:140px;height:140px;border-radius:14px;border:1.5px solid var(--line)"></div></div>').join(''); }
function tile(t, i, showPos) {
  const s = byId(t.id);
  return `<div class="tile" data-open="${t.id}">
    <img src="${esc(t.album.cover_medium)}" alt="" loading="lazy">${showPos ? `<span class="pos">${i + 1}</span>` : ''}
    ${s ? bubble(s) : `<button class="ibtn add plus" data-rank="${t.id}" aria-label="Rank">${IC.plus}</button>`}
    <div class="t">${esc(t.title_short || t.title)}</div><div class="a">${esc(t.artist.name)}</div></div>`;
}
async function loadChart() {
  try { const c = await deezer('chart/0/tracks', { limit: 20 }); const el = $('#chartRail'); if (el) el.innerHTML = remember(c.data).map((t, i) => tile(t, i, true)).join(''); }
  catch (e) { const el = $('#chartRail'); if (el) el.innerHTML = '<p class="sub">Could not reach Deezer.</p>'; }
}
async function loadRecs(seed) {
  try {
    if (recSeed !== seed.id) {
      recSeed = seed.id;
      const rel = await deezer(`artist/${seed.artistId}/related`, { limit: 6 });
      const tops = await Promise.all((rel.data || []).slice(0, 6).map(a => deezer(`artist/${a.id}/top`, { limit: 2 }).then(r => r.data || []).catch(() => [])));
      recCache = remember(tops.flat()).filter(t => !byId(t.id)).slice(0, 10);
    }
    const el = $('#recRail'); if (el) el.innerHTML = recCache.length ? recCache.map((t, i) => tile(t, i, false)).join('') : '<p class="sub">No recommendations found.</p>';
  } catch (e) { const el = $('#recRail'); if (el) el.innerHTML = '<p class="sub">Could not load recommendations.</p>'; }
}
function feedRow(l) {
  const s = byId(l.id); if (!s) return '';
  const verb = l.from != null ? `moved <b>${esc(s.title)}</b> from #${l.from} to #${l.to}` : `ranked <b>${esc(s.title)}</b> at #${l.to}`;
  return `<div class="row" data-open="${s.id}" style="cursor:pointer"><img src="${esc(s.cover)}" alt=""><div class="m"><div class="verb">${esc(state.name)} ${verb}</div><div class="when">${ago(l.ts)} · ${l.picks} duel${l.picks === 1 ? '' : 's'}</div></div>${bubble(s)}</div>`;
}

function openSheet(html) { document.activeElement && document.activeElement.blur(); $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('show'); $('#scrim').classList.add('show'); $('#sheet').scrollTop = 0; syncPlayUI(); }

/* ---------------- RANKING FLOW ---------------- */
// 1) pick a tier  2) binary-search insertion inside that tier, one blind duel per step
let flow = null;
function startRank(song, rerankFrom = null) {
  stop();
  if (!song.genres.length) enrich(song);
  flow = { song, rerankFrom, step: 'tier' };
  openSheet(`
    <button class="ibtn close" onclick="closeSheet()">${IC.x}</button>
    <div data-vinyl="${song.id}" class="vinyl" onclick="toggleFlowPlay()"><img src="${esc(song.cover)}" alt=""></div>
    <div class="playhint">Tap the record for a 30s preview</div>
    <h2 style="text-align:center;margin-top:12px">${esc(song.title)}</h2>
    <div class="sub" style="text-align:center">${esc(song.artist)}</div>
    <div style="font-family:var(--display);font-weight:700;font-size:18px;margin-top:20px">${rerankFrom ? 'Has it grown on you? How does it hit now?' : 'How did it hit?'}</div>
    <div class="tiers">${ORDER.map(k => `<button class="tierb" data-tier="${k}"><span class="dot" style="background:${TIERS[k].color}"></span><span>${TIERS[k].label}<small>${TIERS[k].hint}</small></span><kbd>${TIERS[k].key}</kbd></button>`).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-tier]').forEach(b => b.onclick = () => chooseTier(b.dataset.tier));
  play(song);
}
function toggleFlowPlay() { if (!flow) return; nowPlaying && nowPlaying.id === flow.song.id ? stop() : play(flow.song); }
function chooseTier(tier) {
  const f = flow; f.song.tier = tier; f.step = 'duel';
  const start = state.ranked.findIndex(x => ORDER.indexOf(x.tier) >= ORDER.indexOf(tier));
  f.offset = start === -1 ? state.ranked.length : start;
  f.lo = 0; f.hi = state.ranked.filter(x => x.tier === tier).length;
  f.total = Math.ceil(Math.log2(f.hi + 1)); f.done = 0;
  drawWhy();
}
// step 2: the in-depth breakdown (what makes it hit + when you play it)
function drawWhy() {
  const f = flow, s = f.song; f.step = 'why';
  s.aspects = s.aspects || {}; s.moods = s.moods || [];
  openSheet(`
    <div style="display:flex;gap:12px;align-items:center">
      <div data-vinyl="${s.id}" class="vinyl" style="width:56px;height:56px;margin:0;flex:none" onclick="toggleFlowPlay()"><img src="${esc(s.cover)}" style="width:22px;height:22px;border-width:1px" alt=""></div>
      <div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${s.tier ? ` · <span class="${s.tier}" style="font-weight:700">${TIERS[s.tier].label}</span>` : ''}</div></div>
    </div>
    <h2 style="margin-top:18px">What makes it hit?</h2>
    <div class="sub">Rate what matters to you. Leave anything blank.</div>
    <div class="box" style="padding:4px 14px;margin-top:12px">${ASPECTS.map(([k, l, h]) => `
      <div class="asp"><span>${l}<small>${h}</small></span><div class="dots" data-asp="${k}">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}" class="${(s.aspects[k] || 0) >= n ? 'on' : ''}" aria-label="${l} ${n}"></button>`).join('')}</div></div>`).join('')}</div>
    <div style="font-family:var(--display);font-weight:700;font-size:18px;margin:18px 0 10px">When do you play it?</div>
    <div class="moodchips">${MOODS.map(m => `<button class="pill ${s.moods.includes(m) ? 'on' : ''}" data-mood="${esc(m)}">${m}</button>`).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:20px">${f.editOnly ? '' : '<button class="cta ghost" id="skipWhy">Skip</button>'}<button class="cta" id="nextWhy" style="flex:1">${f.editOnly ? 'Save' : f.hi ? 'Next: blind duels →' : 'Place it →'}</button></div>`);
  $('#sheet').querySelectorAll('[data-asp]').forEach(row => row.onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const k = row.dataset.asp, n = +b.dataset.n;
    s.aspects[k] = s.aspects[k] === n ? 0 : n; // tap the same dot again to clear
    row.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= s.aspects[k]));
  });
  $('#sheet').querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    const m = b.dataset.mood; s.moods = s.moods.includes(m) ? s.moods.filter(x => x !== m) : [...s.moods, m];
    b.classList.toggle('on');
  });
  const next = () => { if (f.editOnly) { save(); flow = null; openDetail(s); } else { f.step = 'duel'; nextDuel(); } };
  $('#nextWhy').onclick = next;
  if ($('#skipWhy')) $('#skipWhy').onclick = next;
}
function nextDuel() {
  const f = flow;
  if (f.lo >= f.hi) return finishRank();
  f.mid = Math.floor((f.lo + f.hi) / 2);
  const other = state.ranked[f.offset + f.mid];
  f.sides = Math.random() < .5 ? [f.song, other] : [other, f.song];
  f.locked = false;
  drawDuel();
  autoPlayDuel();
}
function autoPlayDuel() {
  const f = flow;
  play(f.sides[0], () => { if (flow === f && !f.locked) play(f.sides[1]); });
}
function drawDuel(reveal = false, winner = -1) {
  const f = flow;
  const side = (s, i) => `<div class="side ${winner === i ? 'win' : winner >= 0 ? 'lose' : ''} ${nowPlaying && nowPlaying.id === s.id && !reveal ? 'playing' : ''}" data-side="${i}" data-sid="${s.id}">
      ${blind && !reveal ? `<div class="mys ${i ? 'B' : 'A'}">${i ? 'B' : 'A'}</div><div class="t">Mystery ${i ? 'B' : 'A'}</div><div class="a">${i ? '→' : '←'} to pick</div>`
        : `<img class="cov" src="${esc(s.cover)}" alt=""><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div>`}
      <div class="bars"><i></i><i></i><i></i><i></i></div>
    </div>`;
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div><h2>Which do you prefer?</h2><div class="sub">${blind ? 'Names hidden. Judge the sound.' : 'Tap the one you like more.'}</div></div>
      <div class="toggle" id="blindT"><div class="sw ${blind ? 'on' : ''}"></div>Blind</div>
    </div>
    <div class="duel">${side(f.sides[0], 0)}<div class="vs">VS</div>${side(f.sides[1], 1)}</div>
    <div class="duelfoot"><button class="cta ghost" id="tie">Too tough (T)</button><button class="cta ghost" id="replay">${IC.play.replace('<svg', '<svg style="width:12px;height:12px;vertical-align:-1px"')} Replay</button></div>
    <div class="steps">${Array.from({ length: Math.max(f.total, 1) }, (_, i) => `<i class="${i < f.done ? 'done' : ''}"></i>`).join('')}</div>
    <div class="playhint">Duel ${Math.min(f.done + 1, f.total)} of about ${f.total} · placing within “${TIERS[f.song.tier].label}”</div>`);
  if (reveal) return;
  $('#blindT').onclick = () => { blind = !blind; try { localStorage.setItem('lilt-blind', blind ? 'on' : 'off'); } catch (e) {} drawDuel(); };
  $('#sheet').querySelectorAll('[data-side]').forEach(el => el.onclick = () => pick(+el.dataset.side));
  $('#tie').onclick = tie;
  $('#replay').onclick = autoPlayDuel;
}
// highlight the duel card whose preview is playing
setInterval(() => { document.querySelectorAll('.side[data-sid]').forEach(el => el.classList.toggle('playing', !!nowPlaying && nowPlaying.id == el.dataset.sid && !el.classList.contains('win') && !el.classList.contains('lose'))); }, 200);
function pick(i) {
  const f = flow; if (!f || f.step !== 'duel' || f.locked) return;
  f.locked = true; stop(); state.picks++; f.done++;
  if (f.sides[i] === f.song) f.hi = f.mid; else f.lo = f.mid + 1; // binary search step
  drawDuel(true, i);
  setTimeout(() => { if (flow === f) nextDuel(); }, blind ? 1200 : 450);
}

    </div>`);

document.addEventListener('keydown', e => {

/* ---------------- TASTE PROFILE ---------------- */
function profile(list, sc) {
  const w = s => Math.max(sc.get(s.id) ?? 5, .3);
  const wavg = (arr, f) => { const a = arr.filter(s => f(s)); return a.length ? a.reduce((t, s) => t + f(s) * w(s), 0) / a.reduce((t, s) => t + w(s), 0) : null; };
  const g = {}; list.forEach(s => s.genres.forEach(x => g[x] = (g[x] || 0) + w(s) / s.genres.length));
  const genres = Object.entries(g).sort((a, b) => b[1] - a[1]);
  const ar = {}; list.forEach(s => ar[s.artist] = (ar[s.artist] || 0) + w(s));
  const bpm = wavg(list, s => s.bpm || 0), year = wavg(list, s => +s.year || 0);
  const main = Math.round(Math.min(100, (wavg(list, s => s.rank || 0.001) || 0) / 9000));
  return { genres, artists: Object.entries(ar).sort((a, b) => b[1] - a[1]), bpm: bpm && Math.round(bpm), year: year && Math.round(year), main };
}
function persona(p) {

  const scene = p.main < 35 ? 'Crate-Digging' : p.main < 70 ? 'Indie-Leaning' : 'Chart-Chasing';
  const era = !p.year ? '' : p.year < 1995 ? 'Vintage ' : p.year < 2014 ? 'Nostalgic ' : '';
  const top = p.genres[0] ? p.genres[0][0] : '';
  const noun = { Pop: 'Pop Romantic', 'Rap/Hip Hop': 'Rap Head', Rock: 'Rock Kid', Alternative: 'Alt Dreamer', 'R&B': 'R&B Lover', Dance: 'Dancefloor Regular', Electro: 'Synth Soul', Latin: 'Reggaeton Royal', Country: 'Country Heart', Jazz: 'Jazz Cat', Soul: 'Soul Searcher', 'Indie Pop': 'Indie Kid', Reggae: 'Island Soul', Metal: 'Headbanger', 'Films/Games': 'Soundtrack Nerd', Classical: 'Concert Hall Regular' }[top] || (top ? top + ' Devotee' : 'Music Lover');
  return `${tempo} ${scene} <em>${era}${noun}</em>`;
}

/* ---------------- BLEND (taste compatibility) ---------------- */
function b64e(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, ''); }
function b64d(s) { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }
function myCode() { const sc = scores(); return 'lilt:' + b64e({ n: state.name, l: state.ranked.slice(0, 30).map(s => [s.id, Math.round(sc.get(s.id) * 10), s.artist, s.genres[0] || '', s.title]) }); }
let blendResult = null;
function renderBlend() {

      <button class="cta ghost wide" id="chart">Blend with the charts</button>
    </div>`}`;
  if (blendResult) { $('#again').onclick = () => { blendResult = null; renderBlend(); }; animateRing(); return; }
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(myCode()); toast('Code copied'); } catch (e) { $('#code').value = myCode(); toast('Copy it from the box below'); } };
  $('#go').onclick = () => { try { const o = b64d($('#code').value.replace(/^.*lilt:/, '')); doBlend(o.n || 'Friend', o.l.map(([id, s, a, g, t]) => ({ id, score: s / 10, artist: a, genre: g, title: t }))); } catch (e) { toast('That code doesn’t look right'); } };
  $('#chart').onclick = async () => {
    $('#chart').textContent = 'Loading the chart…';
    try {
      const c = await deezer('chart/0/tracks', { limit: 50 }); remember(c.data);

      doBlend('Deezer Top 50', c.data.map((t, i) => ({ id: t.id, score: 10 - i * 0.18, artist: t.artist.name, genre: albums[i].genres?.data?.[0]?.name || '', title: t.title_short || t.title })));
    } catch (e) { toast('Could not reach Deezer'); $('#chart').textContent = 'Blend with the charts'; }
  };
}
function doBlend(name, theirs) {
  if (!state.ranked.length) return toast('Rank a few songs first');
  const sc = scores();
  const mine = state.ranked.map(s => ({ id: s.id, score: sc.get(s.id), artist: s.artist, genre: s.genres[0] || '', title: s.title, cover: s.cover, tier: s.tier }));
  const tmap = new Map(theirs.map(t => [t.id, t]));
  const shared = mine.filter(m => tmap.has(m.id)).map(m => ({ ...m, theirs: tmap.get(m.id).score, diff: Math.abs(m.score - tmap.get(m.id).score) }));
  // genre & artist overlap, weighted by score
  const vec = (arr, k) => { const v = {}; arr.forEach(x => x[k] && (v[x[k]] = (v[x[k]] || 0) + x.score)); return v; };
  const cos = (a, b) => { let d = 0, na = 0, nb = 0; for (const k in a) { na += a[k] ** 2; if (b[k]) d += a[k] * b[k]; } for (const k in b) nb += b[k] ** 2; return na && nb ? d / Math.sqrt(na * nb) : 0; };
  const gSim = cos(vec(mine, 'genre'), vec(theirs, 'genre')), aSim = cos(vec(mine, 'artist'), vec(theirs, 'artist'));
  const songSim = shared.length ? 1 - shared.reduce((t, s) => t + s.diff, 0) / shared.length / 10 : null;
  let pct = songSim == null ? .65 * gSim + .35 * aSim : .45 * songSim + .35 * gSim + .2 * aSim;
  pct = Math.round(Math.max(3, Math.min(99, pct * 100)));
  const verdict = pct >= 80 ? 'Basically the same person' : pct >= 60 ? 'Road-trip compatible' : pct >= 40 ? 'Some overlap, some arguing' : pct >= 20 ? 'Aux cord negotiations needed' : 'Opposites attract?';
  const fights = shared.filter(s => s.diff >= 2).sort((a, b) => b.diff - a.diff).slice(0, 3);
  const agree = shared.filter(s => s.score >= 6.8 && s.theirs >= 6.8).slice(0, 3);
  const forYou = theirs.filter(t => !byId(t.id)).sort((a, b) => b.score - a.score).slice(0, 4);
  const sbub = v => `<div class="sc ${v >= 6.8 ? 'love' : v >= 3.4 ? 'fine' : 'nope'}">${fmt(v)}</div>`;
  blendResult = `
    <div class="box" style="padding:18px;margin-top:16px;text-align:center">
      <div class="sub" style="font-weight:600">${esc(state.name)} × ${esc(name)}</div>
      <div class="ring" data-pct="${pct}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="9"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)"/></svg><div class="pct"><span id="pctN">0%</span></div></div>
      <div style="font-family:var(--display);font-weight:800;font-size:22px">${verdict}</div>
      <div class="sub">${shared.length} songs in common · genre match ${Math.round(gSim * 100)}% · artist match ${Math.round(aSim * 100)}%</div>
    </div>
    ${agree.length ? `<h3>You both love</h3><div class="box" style="padding:2px 14px">${agree.map(s => `<div class="row" data-open="${s.id}"><img src="${esc(s.cover)}" alt=""><div class="m"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>${sbub(s.score)}${sbub(s.theirs)}</div>`).join('')}</div>` : ''}
    ${fights.length ? `<h3>Songs you’d fight about <small>you · them</small></h3><div class="box" style="padding:2px 14px">${fights.map(s => `<div class="row" data-open="${s.id}"><img src="${esc(s.cover)}" alt=""><div class="m"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>${sbub(s.score)}${sbub(s.theirs)}</div>`).join('')}</div>` : ''}
    ${forYou.length ? `<h3>${esc(name)} thinks you should rank</h3><div class="box" style="padding:2px 14px" id="forYou">${forYou.map(t => `<div class="row" data-fy="${t.id}"><div class="skel" style="width:50px;height:50px;border-radius:10px"></div><div class="m"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>${sbub(t.score)}</div>`).join('')}</div>` : ''}
    <button class="cta ghost wide" id="again" style="margin-top:16px">Blend with someone else</button>`;
  renderBlend();
  forYou.forEach(async t => {
    try {
      const d = pool.get(t.id) ? null : await deezer('track/' + t.id);
      if (d) remember([d]);
      const s = pool.get(t.id), row = document.querySelector(`[data-fy="${t.id}"]`);
      if (s && row) { row.querySelector('.skel').outerHTML = `<img src="${esc(s.cover)}" alt="">`; row.insertAdjacentHTML('beforeend', `<button class="ibtn add" data-rank="${t.id}">${IC.plus}</button>`); }
    } catch (e) {}
  });
}
function animateRing() {
  const r = document.querySelector('.ring'); if (!r) return;
  const pct = +r.dataset.pct, t0 = performance.now();
  requestAnimationFrame(() => { $('#arc').style.strokeDashoffset = 276.5 * (1 - pct / 100); });
  (function tick(t) { const p = Math.min(1, (t - t0) / 1200); const n = $('#pctN'); if (!n) return; n.textContent = Math.round(pct * (1 - Math.pow(1 - p, 3))) + '%'; if (p < 1) requestAnimationFrame(tick); })(t0);
}

/* ---------------- boot ---------------- */
state.ranked.filter(s => !s.genres.length).forEach(enrich);
renderTabbar(); render();
</script>
</body>
</html>
